<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URBAN CAPS | متجر القبعات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #121212; color: #ffffff; padding-bottom: 50px; }
    header { text-align: center; padding: 25px 15px; background: #1a1a1a; border-bottom: 2px solid #333; }
    header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    header p { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

    .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }

    .card { background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 1px solid #333; display: flex; flex-direction: column; }
    .card-img { width: 100%; height: 250px; object-fit: cover; background: #2a2a2a; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
    .card-price { color: #00e676; font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
    .btn-view { background: #00e676; color: #000; font-weight: 700; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: auto; text-align: center; font-size: 1rem; }

    /* Modal Styles */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; overflow-y: auto; }
    .modal-content { background: #1e1e1e; border-radius: 15px; width: 100%; max-width: 500px; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid #333; }
    .close-btn { position: absolute; top: 15px; left: 15px; font-size: 1.5rem; color: #aaa; cursor: pointer; background: none; border: none; }

    .main-photo-container { width: 100%; height: 280px; margin-bottom: 12px; border-radius: 10px; overflow: hidden; background: #2a2a2a; }
    .main-photo { width: 100%; height: 100%; object-fit: cover; }

    .thumbs-container { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .thumb-img { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid #444; opacity: 0.6; transition: 0.2s; }
    .thumb-img.active { border-color: #00e676; opacity: 1; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #ccc; }
    .form-control { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; font-size: 0.95rem; }
    .form-control:focus { border-color: #00e676; outline: none; }

    .total-box { background: #2a2a2a; padding: 12px; border-radius: 8px; text-align: center; margin: 15px 0; font-size: 1.1rem; font-weight: 700; color: #00e676; }
    .btn-submit { background: #00e676; color: #000; font-weight: 800; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1rem; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>URBAN CAPS</h1>
    <p>التوصيل متوفر لـ 58 ولاية - الدفع عند الاستلام</p>
  </header>

  <div class="container">
    <div id="products-grid" class="products-grid">
      <p style="text-align:center; width:100%; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- Order Modal -->
  <div id="order-modal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      
      <div class="main-photo-container">
        <img id="main-photo" class="main-photo" src="" alt="صورة المنتج">
      </div>
      
      <div id="thumbs-container" class="thumbs-container"></div>

      <h2 id="modal-title" style="margin-bottom: 5px;"></h2>
      <p id="modal-price" style="color: #00e676; font-weight: 700; margin-bottom: 15px;"></p>

      <form id="orderform" onsubmit="submitOrder(event)">
        <input type="hidden" id="form-prod-id">
        <input type="hidden" id="form-prod-name">
        <input type="hidden" id="form-prod-price">

        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>المقاس:</label>
            <select id="form-size" class="form-control" required></select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>الكمية:</label>
            <input type="number" id="form-qty" class="form-control" value="1" min="1" onchange="calculateTotal()" oninput="calculateTotal()" required>
          </div>
        </div>

        <div class="form-group">
          <label>الاسم الكامل:</label>
          <input type="text" id="form-name" class="form-control" placeholder="اسمك الكامل" required>
        </div>

        <div class="form-group">
          <label>رقم الهاتف:</label>
          <input type="tel" id="form-phone" class="form-control" placeholder="06XXXXXXXX" required>
        </div>

        <div style="display: flex; gap: 10px;">
          <div class="form-group" style="flex: 1;">
            <label>الولاية:</label>
            <input type="text" id="form-wilaya" class="form-control" placeholder="الولاية" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>البلدية:</label>
            <input type="text" id="form-commune" class="form-control" placeholder="البلدية" required>
          </div>
        </div>

        <div class="form-group">
          <label>العنوان الشخصي:</label>
          <input type="text" id="form-address" class="form-control" placeholder="العنوان أو الشارع" required>
        </div>

        <div class="form-group">
          <label>نوع التوصيل:</label>
          <select id="form-delivery" class="form-control">
            <option value="home">توصيل للمنزل</option>
            <option value="desk">توصيل للمكتب</option>
          </select>
        </div>

        <div class="total-box">
          المجموع الإجمالي: <span id="total-price-display">0</span> دج
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">تأكيد الطلب 🛒</button>
      </form>
    </div>
  </div>

  <script>
    // رابط Apps Script الخاص بك تم دمجه بنجاح
    const API_URL = "https://script.google.com/macros/s/AKfycbzIEQ5X48JKOBOu441QMbkaIQIBeF2GF7Z6HIb7nx8-_qcCspc2jNtNDNOWcDGeMydI/exec";

    let allProducts = [];

    async function fetchProducts() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        allProducts = data;
        renderProducts(data);
      } catch (err) {
        console.error(err);
        document.getElementById('products-grid').innerHTML = '<p style="text-align:center; width:100%; color:red;">حدث خطأ في تحميل المنتجات!</p>';
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      products.forEach(p => {
        const mainImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image || '');
        
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img class="card-img" src="${mainImg}" alt="${p.name}">
          <div class="card-body">
            <div class="card-title">${p.name}</div>
            <div class="card-price">${p.price} دج</div>
            <button class="btn-view" onclick="openModal(${p.id})">عرض والتفاصيل 🛒</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openModal(id) {
      const prod = allProducts.find(p => p.id == id);
      if (!prod) return;

      document.getElementById('form-prod-id').value = prod.id;
      document.getElementById('form-prod-name').value = prod.name;
      document.getElementById('form-prod-price').value = prod.price;
      document.getElementById('modal-title').innerText = prod.name;
      document.getElementById('modal-price').innerText = `${prod.price} دج`;

      // تجهيز معرض الصور
      const images = (prod.images && prod.images.length > 0) ? prod.images : [prod.image];
      const mainPhoto = document.getElementById('main-photo');
      const thumbsContainer = document.getElementById('thumbs-container');
      
      mainPhoto.src = images[0];
      thumbsContainer.innerHTML = '';

      // إضافة thumb.src المفقود لتظهر وتتنقل الصور
      images.forEach((imgUrl, index) => {
        const thumb = document.createElement('img');
        thumb.src = imgUrl; 
        thumb.className = `thumb-img ${index === 0 ? 'active' : ''}`;
        thumb.onclick = function() {
          mainPhoto.src = imgUrl;
          document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        };
        thumbsContainer.appendChild(thumb);
      });

      // قائمة المقاسات
      const sizeSelect = document.getElementById('form-size');
      sizeSelect.innerHTML = '';
      const sizesList = Array.isArray(prod.sizes) ? prod.sizes : [prod.sizes];
      sizesList.forEach(s => {
        sizeSelect.innerHTML += `<option value="${s}">${s}</option>`;
      });

      document.getElementById('form-qty').value = 1;
      document.getElementById('form-qty').max = prod.stock || 10;
      calculateTotal();

      document.getElementById('order-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('order-modal').style.display = 'none';
    }

    function calculateTotal() {
      const unitPrice = Number(document.getElementById('form-prod-price').value) || 0;
      const qty = Number(document.getElementById('form-qty').value) || 1;
      document.getElementById('total-price-display').innerText = unitPrice * qty;
    }

    async function submitOrder(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = "...جاري تسجيل الطلب";

      const unitPrice = Number(document.getElementById('form-prod-price').value);
      const qty = Number(document.getElementById('form-qty').value);

      const payload = {
        productId: document.getElementById('form-prod-id').value,
        productName: document.getElementById('form-prod-name').value,
        size: document.getElementById('form-size').value,
        quantity: qty,
        fullName: document.getElementById('form-name').value,
        phone: document.getElementById('form-phone').value,
        wilaya: document.getElementById('form-wilaya').value,
        commune: document.getElementById('form-commune').value,
        address: document.getElementById('form-address').value,
        deliveryType: document.getElementById('form-delivery').value,
        totalPrice: unitPrice * qty
      };

      try {
        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert('✅ تم تسجيل طلبك بنجاح! سنقوم بمعالجة طلبك والتواصل معك فوراً.');
        closeModal();
        document.getElementById('orderform').reset();
        fetchProducts();
      } catch (err) {
        alert('❌ حدث خطأ، يرجى المحاولة مرة أخرى');
      } finally {
        btn.disabled = false;
        calculateTotal();
      }
    }

    fetchProducts();
  </script>
</body>
</html>
